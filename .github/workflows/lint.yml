name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "ruff>=0.4" requests yamllint

      - name: Yamllint
        run: yamllint docker-compose.yml .github/workflows/lint.yml

      - name: Ruff
        run: ruff check mc_guard.py test_mc_guard_classifier.py

      - name: Unit tests
        run: python3 -m unittest discover -v -s . -p 'test_*.py'

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/pre-update-check.sh scripts/backup.sh \
            bin/safe-deploy.sh bin/docker-mc-guard.sh \
            scripts/check-creepwatch-heartbeat.sh scripts/deploy-mc-guard.sh

      - name: Compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q

  # After merge to main: SSH to prod, git pull, recreate only mc-guard (bot).
  # Configure repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH;
  # optional DEPLOY_PORT (default 22). Do not use secrets.* in job-level `if` (invalid).
  deploy_mc_guard:
    name: Deploy mc-guard (SSH)
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: creepwatch-deploy-main
      cancel-in-progress: false
    steps:
      - name: Decide whether deploy is configured
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST not set — skipping SSH deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve SSH port
        id: ssh
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add SSH host key
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ steps.ssh.outputs.port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull main and restart mc-guard only
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          envs: DEPLOY_PATH
          script: |
            set -eux
            cd "$DEPLOY_PATH"
            test -f docker-compose.yml
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.yml up -d --no-deps mc-guard
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
