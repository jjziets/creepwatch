name: Lint

# Use Node 24 for JavaScript-based actions (GitHub deprecation of Node 20 runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "ruff>=0.4" requests yamllint

      - name: Yamllint
        run: yamllint docker-compose.yml .github/workflows/lint.yml

      - name: Ruff
        run: ruff check mc_guard.py test_mc_guard_classifier.py

      - name: Unit tests
        run: python3 -m unittest discover -v -s . -p 'test_*.py'

      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/pre-update-check.sh scripts/backup.sh scripts/restore.sh \
            bin/safe-deploy.sh bin/docker-mc-guard.sh \
            scripts/check-creepwatch-heartbeat.sh scripts/deploy-mc-guard.sh

      - name: Compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q

  # Boot mc-guard alone against the example env and confirm the Python
  # process reaches its "Whitelist Guard started" log line. Catches issues
  # that `compose config -q` cannot — missing bind mounts (e.g. forgetting
  # to add progress_board.py), import errors, and any startup exception
  # before the main loop. Runs without the minecraft container; mc-guard
  # tolerates a missing minecraft via its retry loops.
  smoketest_mc_guard:
    name: mc-guard startup smoketest
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stage example env for compose
        run: cp .env.example .env

      - name: Boot mc-guard (no deps, no minecraft)
        run: docker compose -f docker-compose.yml up -d --no-deps mc-guard

      - name: Wait for "Minecraft Whitelist Guard started"
        run: |
          set -eu
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            logs=$(docker logs mc-guard 2>&1 || true)
            if printf '%s' "$logs" | grep -q "Minecraft Whitelist Guard started"; then
              echo "OK: mc-guard reached main()."
              exit 0
            fi
            # Bail out as soon as we see an uncaught exception. Otherwise
            # the polite 90s timeout makes failures slow to diagnose.
            if printf '%s' "$logs" | grep -E "Traceback|ModuleNotFoundError|ImportError" >/dev/null; then
              echo "FAIL: mc-guard reported a startup exception:" >&2
              printf '%s\n' "$logs" >&2
              exit 1
            fi
            sleep 2
          done
          echo "TIMEOUT: mc-guard did not log the startup marker within 90s." >&2
          docker logs mc-guard >&2 || true
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml down --remove-orphans

  # After merge to main: rsync this checkout to DEPLOY_PATH, then recreate mc-guard only.
  # Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH; optional DEPLOY_PORT.
  # Do not use secrets.* in job-level `if` (invalid).
  deploy_mc_guard:
    name: Deploy mc-guard (SSH)
    needs: [lint, smoketest_mc_guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: creepwatch-deploy-main
      cancel-in-progress: false
    steps:
      - name: Decide whether deploy is configured
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST not set — skipping SSH deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.skip != 'true'

      - name: Resolve SSH port
        id: ssh
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add SSH host key
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ steps.ssh.outputs.port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rsync tree to server (preserves .env, data/, backup tarballs)
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eux
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_ci_key
          chmod 600 ~/.ssh/deploy_ci_key
          export RSYNC_RSH="ssh -i ${HOME}/.ssh/deploy_ci_key -p ${PORT} -o IdentitiesOnly=yes"
          rsync -az --mkpath \
            --exclude '.git/' \
            --exclude 'data/' \
            --exclude '.env' \
            --exclude 'backups/*.tar.gz' \
            --exclude '.github/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          rm -f ~/.ssh/deploy_ci_key

      - name: Recreate mc-guard on server
        if: steps.gate.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.ssh.outputs.port }}
          envs: DEPLOY_PATH
          script: |
            set -eux
            cd "$DEPLOY_PATH"
            test -f docker-compose.yml
            # --force-recreate so deploys with only bind-mounted code
            # changes (mc_guard.py, progress_board.py) actually restart the
            # Python process. Without it `compose up -d` is a no-op when
            # nothing in the compose definition changed, and the running
            # process keeps holding the previous version in memory.
            docker compose -f docker-compose.yml up -d --no-deps --force-recreate mc-guard
            # Wait for the new process to reach main() before claiming success.
            for i in $(seq 1 60); do
              if docker logs --since 30s mc-guard 2>&1 | grep -q "Minecraft Whitelist Guard started"; then
                echo "mc-guard back up after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "mc-guard did not log startup marker within 60s after recreate" >&2
            docker logs --tail 50 mc-guard >&2 || true
            exit 1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
